name: Signed release bundle

# Builds the signed .aab that goes to Google Play, so a release no longer
# depends on the signing setup of one particular PC.
#
# Runs on every merge to the main branch, and by hand from the Actions tab.
# The bundle is attached to the run: open the run, scroll to "Artifacts",
# download "CyOpsTD-release-aab", unzip, upload the .aab to Play Console.
#
# It needs the upload key, which lives ONLY in this repository's encrypted
# Actions secrets (Settings > Secrets and variables > Actions), never in the
# code. PLAY_STORE_RELEASE.md ("Signed bundles from GitHub") has the steps.
# Without the key secrets it stops with a message saying which is missing,
# rather than producing an unsigned bundle Play would reject.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/packet-bastion-ascii-defense-peoygp

permissions:
  contents: read

concurrency:
  group: release-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      # Read by the build's secret() lookup: dots become underscores.
      CYOPS_KEYSTORE_PASSWORD: ${{ secrets.CYOPS_KEYSTORE_PASSWORD }}
      CYOPS_KEY_ALIAS: ${{ secrets.CYOPS_KEY_ALIAS }}
      CYOPS_KEY_PASSWORD: ${{ secrets.CYOPS_KEY_PASSWORD }}
      # Optional. Each one left unset simply turns that feature off.
      CYOPS_GAMES_APPID: ${{ secrets.CYOPS_GAMES_APPID }}
      CYOPS_GAMES_LEADERBOARD_STANDARD: ${{ secrets.CYOPS_GAMES_LEADERBOARD_STANDARD }}
      CYOPS_GAMES_LEADERBOARD_HACK_AI: ${{ secrets.CYOPS_GAMES_LEADERBOARD_HACK_AI }}
      CYOPS_ADMOB_APPID: ${{ secrets.CYOPS_ADMOB_APPID }}
      CYOPS_ADMOB_REWARDEDID: ${{ secrets.CYOPS_ADMOB_REWARDEDID }}
      CYOPS_ADMOB_INTERSTITIALID: ${{ secrets.CYOPS_ADMOB_INTERSTITIALID }}
    steps:
      - name: Check the signing secrets are set
        env:
          KEYSTORE_B64: ${{ secrets.CYOPS_KEYSTORE_BASE64 }}
        run: |
          missing=""
          [ -z "$KEYSTORE_B64" ] && missing="$missing CYOPS_KEYSTORE_BASE64"
          [ -z "$CYOPS_KEYSTORE_PASSWORD" ] && missing="$missing CYOPS_KEYSTORE_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Signing secrets not set:$missing. See PLAY_STORE_RELEASE.md, 'Signed bundles from GitHub'."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore the upload key
        env:
          KEYSTORE_B64: ${{ secrets.CYOPS_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cyopstd-upload.jks"
          echo "CYOPS_KEYSTORE_PATH=$RUNNER_TEMP/cyopstd-upload.jks" >> "$GITHUB_ENV"

      - name: Build the signed bundle
        run: ./gradlew bundleRelease --no-daemon

      - name: Confirm it is signed
        run: |
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tee /dev/stderr | grep -q "jar verified"

      - name: Name it by version
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          mv app/build/outputs/bundle/release/app-release.aab "CyOpsTD-v${version}-${code}.aab"
          echo "AAB_NAME=CyOpsTD-v${version}-${code}.aab" >> "$GITHUB_ENV"

      - name: Attach the bundle to the run
        uses: actions/upload-artifact@v4
        with:
          name: CyOpsTD-release-aab
          path: ${{ env.AAB_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach the R8 mapping (upload to Play for readable crash reports)
        uses: actions/upload-artifact@v4
        with:
          name: CyOpsTD-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/cyopstd-upload.jks"
