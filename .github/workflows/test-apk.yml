name: Test APK

# Manual only. This builds the installable *debug* APK for on-device testing
# and attaches it to the run, so a build can be downloaded from GitHub without
# anyone needing a local Android toolchain.
#
# Deliberately not a release: the artifact is a debug build with the
# `.debug` application id and Google's test ad units, and it is not the thing
# that goes to Play. The Play artifact is a signed release bundle, and signing
# happens on the owner's machine because the upload key never leaves it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Attach it to the run
        uses: actions/upload-artifact@v4
        with:
          name: CyOpsTD-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
